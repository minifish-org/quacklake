services:
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  createbuckets:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb local/lakehouse || true;
      /usr/bin/mc anonymous set public local/lakehouse;
      exit 0;
      "

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      APP_ENV: development
      RUST_LOG: info
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      - minio
    ports:
      - "127.0.0.1:8080:8080"

  runner:
    build:
      context: ./runner
    environment:
      APP_ENV: development
      PORT: 3000
      RUNNER_MAX_CONCURRENT_QUERIES: 4
      RUNNER_ALLOWED_URL_PREFIXES: http://gateway:8080/objects/,http://localhost:8080/objects/,http://127.0.0.1:8080/objects/
    ports:
      - "127.0.0.1:3000:3000"

  browser:
    build:
      context: ./browser
    depends_on:
      - gateway
    ports:
      - "127.0.0.1:8081:8081"

  api:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    environment:
      APP_ENV: development
      RUST_LOG: info
      API_PORT: 8000
      RUNNER_URL: http://runner:3000
      GATEWAY_BASE_URL: http://gateway:8080
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: lakehouse
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      DEFAULT_MAX_SECONDS: 20
      DEFAULT_MAX_SCAN_BYTES: 268435456
      DEFAULT_MAX_OUTPUT_BYTES: 67108864
      DEFAULT_MAX_MEMORY_MB: 512
      MAX_CONCURRENT_JOBS: 8
      DEFAULT_READ_PREFIXES: demo/,datasets/public/
      DEFAULT_WRITE_PREFIXES: agent/
    depends_on:
      - minio
      - runner
      - gateway
      - createbuckets
    ports:
      - "127.0.0.1:8000:8000"
