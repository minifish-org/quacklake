name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --workspace --all-features

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Runner tests
        run: |
          cd runner
          npm ci
          npm test

      - name: Verify duckdb-wasm versions are in sync
        run: ./scripts/check_duckdb_wasm_version.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Collect coverage
        run: ./scripts/coverage.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: coverage/*

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Cargo audit
        run: cargo audit
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - name: NPM audit (runner)
        run: |
          cd runner
          npm audit --omit=dev --audit-level=high

  gateway-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gateway range e2e
        run: ./scripts/test_gateway_range.sh

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/browser-smoke/package-lock.json
      - name: Install Playwright (Chromium)
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tools/browser-smoke/package-lock.json') }}
      - name: Install browser-smoke deps
        run: |
          cd tools/browser-smoke
          npm ci
      - name: Install Playwright browser and system dependencies
        run: |
          cd tools/browser-smoke
          npx playwright install --with-deps chromium
      - name: Browser duckdb-wasm smoke e2e
        env:
          BROWSER_SMOKE_SKIP_PLAYWRIGHT_INSTALL: "1"
        run: ./scripts/browser_smoke.sh
