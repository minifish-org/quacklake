services:
  gateway:
    environment:
      APP_ENV: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  runner:
    environment:
      APP_ENV: production
      RUNNER_AUTH_TOKENS: ${RUNNER_AUTH_TOKENS:?set RUNNER_AUTH_TOKENS}
      RUNNER_MAX_CONCURRENT_QUERIES: ${RUNNER_MAX_CONCURRENT_QUERIES:-8}
    restart: unless-stopped
    ports: !reset []
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    environment:
      APP_ENV: production
      API_KEYS: ${API_KEYS:-}
      JWT_HS256_SECRET: ${JWT_HS256_SECRET:-}
      RUNNER_AUTH_TOKENS: ${RUNNER_AUTH_TOKENS:?set RUNNER_AUTH_TOKENS}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-16}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio:
    restart: unless-stopped
    ports: !reset []

  browser:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
